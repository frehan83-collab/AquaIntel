version: "3.9"

services:
  # Database: TimescaleDB (PostgreSQL + time-series extensions)
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fishintel-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aquaintel
      POSTGRES_USER: aquaintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquaintel-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend: API (4 Gunicorn workers)
  fishintel:
    build: .
    container_name: fishintel-core
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=postgresql+psycopg2://aquaintel:${POSTGRES_PASSWORD:-aquaintel-dev-password}@db:5432/aquaintel
      - PYTENSOR_FLAGS=device=cpu,floatX=float64,optimizer=fast_compile,cxx=
      - FISHINTEL_JWT_SECRET=${FISHINTEL_JWT_SECRET:?FISHINTEL_JWT_SECRET is required - generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"}
      - FISHINTEL_ENV=production
      - FISKERIDIR_BIOSTAT_JSON=/app/data/biostat-total-flk.json

  # Background agents (12 + sentiment polling) as their own service.
  # Previously agents were absent from the production deployment entirely —
  # the 15-min data-ingest loop, signal generation, prediction and hedging
  # never ran in production. Separate service also means an API restart no
  # longer takes data ingest down with it. SIGTERM is handled gracefully
  # (stop_grace_period lets the httpx-client + DB cleanup finish).
  fishintel-agents:
    build: .
    container_name: fishintel-agents
    command: python main.py --agents-only
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
    environment:
      - DATABASE_URL=postgresql+psycopg2://aquaintel:${POSTGRES_PASSWORD:-aquaintel-dev-password}@db:5432/aquaintel
      - PYTENSOR_FLAGS=device=cpu,floatX=float64,optimizer=fast_compile,cxx=
      - FISHINTEL_JWT_SECRET=${FISHINTEL_JWT_SECRET:?FISHINTEL_JWT_SECRET is required - generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"}
      - FISHINTEL_ENV=production
      - FISKERIDIR_BIOSTAT_JSON=/app/data/biostat-total-flk.json

  # Frontend: Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
    container_name: fishintel-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - fishintel
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # Nginx reverse proxy (serves both on port 80/443)
  nginx:
    image: nginx:alpine
    container_name: fishintel-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - fishintel
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
