# OpenClaw Agent Deployment Manifest
# ===================================
# Defines the multi-agent topology for OpenClaw orchestration.

name: openclaw-lice-arbitrage
version: "1.0.0"
description: >
  Lice-Impact Arbitrage Bot for Norwegian aquaculture markets.
  Deploys autonomous agents that scrape per-farm lice data,
  correlate with stock-specific production exposure, and generate
  conditional trading signals.

agents:
  - name: data_ingest
    module: agents.data_ingest.DataIngestAgent
    interval: 900  # 15 minutes
    priority: high
    resources:
      memory: 256Mi
      cpu: 0.25
    health_check:
      endpoint: /api/health
      interval: 60

  - name: exposure_mapper
    module: agents.exposure_mapper.ExposureMapperAgent
    interval: 3600  # 1 hour
    priority: medium
    depends_on:
      - data_ingest
    resources:
      memory: 128Mi
      cpu: 0.1

  - name: correlation_engine
    module: agents.correlation_engine.CorrelationEngineAgent
    interval: 900  # 15 minutes
    priority: high
    depends_on:
      - data_ingest
      - exposure_mapper
    resources:
      memory: 512Mi
      cpu: 0.5

  - name: signal_generator
    module: agents.signal_generator.SignalGeneratorAgent
    interval: 900
    priority: high
    depends_on:
      - correlation_engine
    resources:
      memory: 256Mi
      cpu: 0.25

  - name: execution
    module: execution.execution_agent.ExecutionAgent
    interval: 30  # fast check for confirmed signals
    priority: critical
    depends_on:
      - signal_generator
    resources:
      memory: 128Mi
      cpu: 0.1

  - name: compliance
    module: compliance.compliance_agent.ComplianceAgent
    interval: 3600
    priority: medium
    resources:
      memory: 128Mi
      cpu: 0.1

scaling:
  min_replicas: 1
  max_replicas: 3
  scale_on:
    - metric: queue_depth
      threshold: 100
    - metric: cpu_utilization
      threshold: 80

secrets:
  - name: barentswatch-credentials
    env_vars:
      - BARENTSWATCH_CLIENT_ID
      - BARENTSWATCH_CLIENT_SECRET
  - name: broker-credentials
    env_vars:
      - NORDNET_USERNAME
      - NORDNET_PASSWORD

monitoring:
  metrics_port: 9090
  log_level: INFO
  alert_channels:
    - email
    - slack
