# Production topology — closes the "agents never run in production" truth gap.
#
# The production Docker image ran API-only (`gunicorn core.api:app`), so the 12
# background agents never executed in production: ingest, forecasts and index
# publication silently stopped. Here they are an explicit, separate service, and
# PostgreSQL + TimescaleDB is the datastore (SQLite is rejected in production by
# config/settings.py).
#
# Run:  docker compose -f docker-compose.prod.yml up -d
# Check: python scripts/verify_production_truth.py

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquaintel}
      POSTGRES_USER: ${POSTGRES_USER:-aquaintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-timescale.sql:/docker-entrypoint-initdb.d/10-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquaintel} -d ${POSTGRES_DB:-aquaintel}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    command: >
      gunicorn core.api:app
      -k uvicorn.workers.UvicornWorker
      -w ${API_WORKERS:-4}
      -b 0.0.0.0:8000
      --access-logfile - --error-logfile -
    environment: &app_env
      FISHINTEL_ENV: production
      FISHINTEL_JWT_SECRET: ${FISHINTEL_JWT_SECRET:?FISHINTEL_JWT_SECRET is required}
      FISHINTEL_ADMIN_EMAILS: ${FISHINTEL_ADMIN_EMAILS:-}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aquaintel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aquaintel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - artifacts:/app/artifacts      # published accuracy artifacts (tracked data)
      - models:/app/data/models       # model weights, shipped separately
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 6

  agents:
    build: .
    restart: unless-stopped
    # THE FIX: agents are a first-class production service.
    command: python main.py --agents-only
    environment: *app_env
    volumes:
      - artifacts:/app/artifacts
      - models:/app/data/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  artifacts:
  models:
