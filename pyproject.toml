# AquaIntel — uv project manifest (P0-4).
#
# Python version decision (required by the execution plan): **pin 3.12**.
# - CI (test.yml) already ran on 3.12; Dockerfile is python:3.12-slim.
# - Local dev on 3.14 must not silently become the torch-stack target
#   (torch et al. lag new CPython lines); uv-managed envs are 3.12-only.
#   Light 3.14 dev remains possible via plain pip (no model extras).
#
# `pip install -r requirements.txt` remains supported; regenerate that file
# from this manifest with `uv export --no-hashes --no-dev` when it changes.
#
# NOTE: version must stay in sync with core/version.py (PLATFORM_VERSION).
[project]
name = "aquaintel"
version = "2.2.0"
description = "AquaIntelligence — salmon aquaculture intelligence platform"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    # Data & ML
    "pandas>=2.1",
    "numpy>=1.26",
    # scipy 1.11.x required when uni2ts (models extra) is installed
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "catboost>=1.2",
    "mapie>=0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg2-binary>=2.9",
    # Dashboard
    "streamlit>=1.32",
    "plotly>=5.18",
    "altair>=5.2",
    # API framework
    # Pinned range: CI must install the SAME line the platform is verified on.
    # fastapi 0.143+ changed include_router to lazy _IncludedRouter entries,
    # which alters app.routes introspection (route-audit tests).
    "fastapi>=0.135.2,<0.136",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    # Auth & security
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
    # Broker integrations
    "ib_insync>=0.9.86",
    # Billing / reporting / notifications
    "stripe>=8.0",
    "fpdf2>=2.7",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "twilio>=9.0",
    # Copernicus Marine (algal bloom module)
    "copernicusmarine>=1.0",
    # Intelligence engine (AIS, sentiment, farm graph, pairs)
    "networkx>=3.2",
    "feedparser>=6.0",
    "websockets>=12.0",
    "hmmlearn>=0.3",
    "pyod>=1.1",
    "vectorbt>=0.26",
    "tigramite>=5.2",
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    # LLM integration
    "anthropic>=0.40",
    "openai>=1.50",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    # Observability
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    # Utilities
    "tenacity>=8.2",
    "structlog>=24.1",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
# Heavy foundation-model stack (~2 GB with torch) — mirrors
# requirements-models.txt. Engines degrade to documented fallbacks when
# absent; never report fallback results as live model output.
# PyG extra (torch_scatter/torch_sparse) stays a manual step — see
# requirements-models.txt comments.
models = [
    "torch>=2.2.0",
    "torch_geometric>=2.5.0",
    "pytorch-forecasting>=1.1.0",
    "pytorch-lightning>=2.2.0",
    "chronos-forecasting>=1.3",
    "timesfm>=2.0",
    "uni2ts>=1.0",
]

[tool.uv]
# Application repo: never build/install the project itself into the env.
package = false
