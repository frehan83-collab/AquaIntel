# Ruff configuration — ratchet policy (Session 41, REPORT_STACK top-10 #7)
#
# ENFORCED in CI (must pass):
#   E9   — runtime/syntax errors (e.g. E999 SyntaxError)
#   F821 — undefined name            (caught two dead chat-answer branches!)
#   F811 — redefinition while unused
#   F401 — unused import             (probes annotated with `# noqa: F401`)
#   F841 — unused local variable     (Session 41d: all 36 fixed — dead pure
#          expressions deleted, side-effecting calls kept as bare statements)
#
# Everything beyond this is intentionally absent until the next wave: E501
# line length, import sorting (I), docstring rules, blind-except (BLE), etc.
target-version = "py312"

[lint]
select = ["E9", "F821", "F811", "F401", "F841"]

exclude = [
    ".venv",
    "node_modules",
    "frontend",
    "models",
]
