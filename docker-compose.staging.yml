# Docker Compose override for staging environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
version: "3.9"

services:
  fishintel:
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://aquaintel:${POSTGRES_PASSWORD:-aquaintel-dev-password}@db:5432/aquaintel
      - PYTENSOR_FLAGS=device=cpu,floatX=float64,optimizer=fast_compile,cxx=
      - FISHINTEL_JWT_SECRET=${FISHINTEL_JWT_SECRET:-staging-secret}
      - FISHINTEL_ENV=staging
      - FISHINTEL_LOG_LEVEL=DEBUG
      - FISKERIDIR_BIOSTAT_JSON=/app/data/biostat-total-flk.json
    deploy:
      resources: {}

  frontend:
    ports:
      - "3001:3000"
    deploy:
      resources: {}

  # Production parity: the image's default CMD is the API only
  # (gunicorn core.api:app), so background agents must be deployed as a
  # SEPARATE service running the same image. Without this, nothing ingests
  # data, backfills history, or generates signals.
  fishintel-agents:
    environment:
      - DATABASE_URL=postgresql+psycopg2://aquaintel:${POSTGRES_PASSWORD:-aquaintel-dev-password}@db:5432/aquaintel
      - FISHINTEL_JWT_SECRET=${FISHINTEL_JWT_SECRET:-staging-secret}
      - FISHINTEL_ENV=staging
      - FISHINTEL_LOG_LEVEL=DEBUG
    deploy:
      resources: {}
