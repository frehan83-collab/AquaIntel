# Frontend build — validates the Next.js/React/TypeScript frontend compiles cleanly
name: Frontend Build

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
  pull_request:
    branches: [master, main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js 22 (LTS) with npm cache
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Clean install of dependencies (CI-optimized)
      - name: Install dependencies
        run: npm ci

      # 4. Type check (Next 16 generated types included)
      - name: Type check
        run: npx tsc --noEmit

      # 5. Lint (flat config; warnings tolerated, errors fail)
      - name: Lint
        run: npm run lint

      # 6. Verify design tokens are in sync
      - name: Verify design token sync
        run: python ../scripts/design_token_pipeline.py --verify
        continue-on-error: true

      # 7. Build the Next.js application (Turbopack default in Next 16)
      - name: Build frontend
        run: npm run build

      # 5. Install Playwright browsers for E2E tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/

      # 8. Visual regression (Linux baselines committed; deterministic stubs) — BLOCKING
      - name: Run visual regression tests
        run: npx playwright test e2e/visual.spec.ts --reporter=github
        working-directory: frontend/

      # 9. Remaining E2E tests (some need the FastAPI backend on :8000)
      - name: Run remaining E2E tests
        run: npx playwright test --reporter=github --grep-invert "visual baseline"
        working-directory: frontend/
        continue-on-error: true

      - name: Security audit (npm)
        run: npm audit --audit-level=high || true
        continue-on-error: true
        working-directory: frontend/
