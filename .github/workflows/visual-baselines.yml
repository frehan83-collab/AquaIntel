# Visual baselines — generate or verify Playwright snapshots on Linux.
#
# The committed baselines are win32 (local). CI runs on ubuntu, so Linux
# baselines must be generated here once (workflow_dispatch, update=true),
# downloaded as an artifact, committed, and thereafter verified by
# frontend.yml's e2e step (which picks up visual.spec.ts automatically).
name: Visual Baselines

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Generate/refresh baselines (--update-snapshots)"
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual spec (update=${{ inputs.update }})
        run: |
          if [ "${{ inputs.update }}" = "true" ]; then
            npx playwright test e2e/visual.spec.ts --project=chromium --update-snapshots
          else
            npx playwright test e2e/visual.spec.ts --project=chromium
          fi

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: frontend/e2e/visual.spec.ts-snapshots/
          if-no-files-found: warn
          retention-days: 14
