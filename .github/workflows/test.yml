# Backend test suite — runs pytest against API routes, market engines, and data integrity
name: Backend Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # JWT secret required by the FishIntel auth layer during tests
      FISHINTEL_JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.12 (pinned for CI stability)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2b. Set up uv (fast, deterministic installs from requirements.lock)
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3. Install Python dependencies (locked via uv; see pyproject.toml P0-4)
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.lock

      # 4. Ruff ratchet (E9/F821/F811/F401/F841) — makes the config's
      #    "ENFORCED in CI" claim true; rule selection lives in ruff.toml.
      - name: Ruff ratchet
        run: uvx ruff check .

      # 5. Run the full test suite with coverage
      #    FISHINTEL_RATE_LIMIT: raise the global rate limit for the suite
      #    (hundreds of requests from one TestClient IP); enforcement is
      #    verified explicitly in tests/test_rate_limit.py.
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=core --cov-report=term-missing --cov-fail-under=50
        env:
          FISHINTEL_RATE_LIMIT: 100000/minute

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict || true
        continue-on-error: true
