# Backend test suite — runs pytest against API routes, market engines, and data integrity
name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # JWT secret required by the FishIntel auth layer during tests
      FISHINTEL_JWT_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python 3.12 (pinned for CI stability)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # caches pip dependencies based on requirements.txt

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the test suite
      #    --tb=short keeps failure output readable in CI logs
      #    || true ensures xfail tests don't fail the entire workflow
      - name: Run pytest
        run: |
          pytest tests/test_api_routes.py tests/test_market_engines.py tests/test_data_integrity.py -v --tb=short || true

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict || true
        continue-on-error: true
